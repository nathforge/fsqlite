name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macFUSE (libfuse for linking)
        run: brew install --cask macfuse
      - name: Build
        run: bash scripts/build.sh
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.tar.gz

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install aarch64 cross-linker
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: bash scripts/build.sh
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/fsqlite_darwin_arm64.tar.gz \
            dist/fsqlite_darwin_amd64.tar.gz \
            dist/fsqlite_linux_amd64.tar.gz \
            dist/fsqlite_linux_arm64.tar.gz \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Update Homebrew tap
        run: bash scripts/update-tap.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_TAP_TOKEN }}
