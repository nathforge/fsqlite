[package]
name = "fsqlite"
version = "0.1.1"
edition = "2024"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
fuser = "0.18.0"
libc = "0.2.191"
percent-encoding = "2.3.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
